# Two top-level rows and no preset. Rows at the top of the profile are visible to every Agent:
# DSH scopes inherit their ancestors' registrations and admit untagged listeners for every
# descendant (dsh-scope), which is how DSH's own bundles add tools. So the plugin no longer
# overrides the shipped `standard` preset with a copy of its rows, and a DSH upgrade changes nothing here.
- insert:
    - id: dsh-agent-scheduler
      name: dsh-agent-scheduler
      config: {}
    - id: agent-scheduler-rule
      name: dsh-agent-scheduler/rule
      config: {}
